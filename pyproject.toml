[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-talks-pipeline"
version = "0.1.0"
description = "Scrape cyber conference talks (detection engineering, threat intel, agentic security) and transcriptions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "youtube-transcript-api>=1.0.0",
  "yt-dlp>=2024.8.0",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "pydantic>=2.0.0",
  "pyyaml>=6.0",
  "rich>=13.0.0",
  "click>=8.1.0",
  "tenacity>=8.2.0",
  "lxml>=5.0.0",
]

[project.scripts]
cyber-talks = "cyber_talks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
