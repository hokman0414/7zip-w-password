[project]
name = "royale-diamonds-osint"
version = "0.1.0"
description = "Evidence-first OSINT investigation pipeline for TikTok Shop diamond auctions"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "pandas>=2.2",
  "pydantic>=2.7",
  "networkx>=3.3",
  "playwright>=1.40",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]