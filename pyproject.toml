[project]
name = "silent-stocks"
version = "0.1.0"
description = "Silent Stocks: STEMPLE multi-assignment investment-intelligence research platform"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "apscheduler>=3.10,<4",
  "tzdata",
  "streamlit>=1.35",
  "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
silent-stocks = "silent_stocks.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["silent_stocks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
